name: Dedicated Test Suite

on:
  push:
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'

jobs:
  test:
    name: Run Jest & React Testing Library Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Testing Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm install --save-dev --legacy-peer-deps jest @types/jest ts-jest @testing-library/react @testing-library/jest-dom @testing-library/dom

      - name: Run Test Suite with Coverage
        run: npm run test:coverage

      - name: Report Coverage Summary
        if: always()
        run: |
          echo "### Test Execution & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "All unit and component tests completed with 80%+ threshold enforcement." >> $GITHUB_STEP_SUMMARY
